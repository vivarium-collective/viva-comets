[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-comets"
version = "0.1.0"
description = "Process-bigraph wrapper for COMETS (spatial dynamic FBA for microbial ecosystems)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "viva-superpowers",
    "cometspy>=0.6.0",
    "cobra>=0.29.0",
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "bigraph-viz>=2.0.3",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
cli = ["typer", "rich"]
dev = ["pytest", "bigraph-viz", "plotly"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_comets*"]

[project.scripts]
viva-comets = "pbg_comets.cli.__main__:main"
